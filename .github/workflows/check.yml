name: Check pools

# Every pool parses and is scrubbed, names are well formed, manifests and files agree.
on:
  pull_request:
  # Pull requests opened by the import workflows with the default GITHUB_TOKEN do not start
  # pull_request runs, so those workflows dispatch this one on their branch instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Check pools
        run: python scripts/check_pools.py
      - name: Script tests
        run: python -m unittest discover -s scripts/tests
