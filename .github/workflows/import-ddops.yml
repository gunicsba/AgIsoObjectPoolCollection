name: Import DDOPs

# Finds DDOPs attached to issues of a source repository, scrubs them, and opens a pull request
# with the new ones in incoming/ plus incoming/REPORT.md. Never commits to the default branch and
# never writes an unscrubbed pool: scripts/import_ddops.py scrubs before writing, and
# scripts/check_pools.py re-checks incoming/ before anything is committed.
#
# One-time repository setup: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". Optional secret PR_TOKEN (a token that may push branches and open pull
# requests): with it the pull request also gets the normal pull_request checks.
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Repository whose issues to read (owner/name)
        required: true
        default: AgOpenGPS-Official/AOG-TaskController
      issues:
        description: Issue numbers, comma separated (empty = all issues)
        required: false
        default: ""
      since:
        description: Only issues, comments and updates on or after this date, YYYY-MM-DD (empty = no limit)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: import-ddops
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # push the import branch, never the default branch
      pull-requests: write   # open the pull request
      actions: write         # dispatch the check workflow on that branch
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.PR_TOKEN || github.token }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Import
        # Inputs go through the environment, never into the script text.
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          ISSUES: ${{ inputs.issues }}
          SINCE: ${{ inputs.since }}
        run: python scripts/import_ddops.py --repo "$SOURCE_REPO" --issues "$ISSUES" --since "$SINCE"

      - name: Nothing new
        if: hashFiles('incoming/*.ddop') == ''
        run: echo "No new DDOPs found; no pull request opened." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the staged pools
        if: hashFiles('incoming/*.ddop') != ''
        run: python scripts/check_pools.py

      - name: Open pull request
        if: hashFiles('incoming/*.ddop') != ''
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          count=$(ls incoming/*.ddop | wc -l)
          cat incoming/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Candidate DDOPs found in issues of \`$SOURCE_REPO\`, scrubbed (serial number and NAME identity number)."
            echo "Generated by the *Import DDOPs* workflow, run ${GITHUB_RUN_ID}. Nothing here is in \`ddop/\` yet:"
            echo "review, move the pools you want to keep, run \`python scripts/build_manifest.py\`, and delete the rest."
            echo
            head -c 60000 incoming/REPORT.md
          } > "$RUNNER_TEMP/pr-body.md"
          bash scripts/open_pr.sh import-ddops "Import $count DDOP candidate(s) from $SOURCE_REPO" \
            "$RUNNER_TEMP/pr-body.md" incoming | tee "$RUNNER_TEMP/open-pr.log"
          branch=$(git branch --show-current)
          # A pull request made with the default token does not start pull_request runs; run the checks here.
          gh workflow run check.yml --ref "$branch" || echo "could not dispatch check.yml (run it manually)"
