name: Validate VT pools

# Every pools/<manufacturer>/<slug>/ has pool.iop and a meta.yaml valid against
# schema/meta.schema.json, ids are unique, reference/ files are well named.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Validate pools
        run: python tools/validate.py
